<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="vv terminal demo">
  <defs>
    <clipPath id="rounded"><rect x="0" y="0" width="880" height="360" rx="14" ry="14"/></clipPath>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .chrome-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .fadegroup { animation: cyclefade 9.0s ease-in-out infinite; }
    @keyframes cyclefade {
      0% { opacity: 1; }
      86.7% { opacity: 1; }
      100.0% { opacity: 0; }
      99.9% { opacity: 0; }
      100% { opacity: 0; }
    }
    .ch { opacity: 0; animation: charin 9.0s steps(1) infinite; }
    @keyframes charin {
      0% { opacity: 0; }
      0.3% { opacity: 1; }
      99.9% { opacity: 1; }
      100% { opacity: 0; }
    }
    .ch-d600{animation-delay:0.60s;}.ch-d690{animation-delay:0.69s;}
    .cursor { animation: cursorlife 9.0s steps(1) infinite; animation-delay: 0.78s; }
    @keyframes cursorlife {
      0% { opacity: 1; }
      6.11% { opacity: 1; }
      6.21% { opacity: 0; }
      99.9% { opacity: 0; }
      100% { opacity: 0; }
    }
    .resp { opacity: 0; transform: translateY(6px); animation: respin 9.0s ease-out infinite; }
    @keyframes respin {
      0% { opacity: 0; transform: translateY(6px); }
      1% { opacity: 0; transform: translateY(6px); }
      6% { opacity: 1; transform: translateY(0); }
      99.9% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; }
    }
    .resp-line0{animation-delay:1.33s;}.resp-line1{animation-delay:1.75s;}.resp-line2{animation-delay:2.17s;}.resp-line3{animation-delay:2.59s;}
  </style>

  <g clip-path="url(#rounded)">
    <rect x="0" y="0" width="880" height="360" fill="#14171f"/>
    <rect x="0" y="0" width="880" height="44" fill="#1c202b"/>
    <line x1="0" y1="44" x2="880" y2="44" stroke="#333a4d" stroke-width="1"/>
    <circle cx="26" cy="22" r="6.5" fill="#ff5f56"/>
    <circle cx="46" cy="22" r="6.5" fill="#ffbd2e"/>
    <circle cx="66" cy="22" r="6.5" fill="#27c93f"/>
    <text class="chrome-title" x="440.0" y="27" text-anchor="middle" font-size="13" fill="#9aa1b2">vv — claude</text>

    <g class="fadegroup">
      <text x="40" y="90" font-size="17" fill="#9aa1b2">$ claude</text>

      <text x="40" y="140" font-size="17" fill="#e8a33d">&gt;</text>
      <text x="66" y="140" font-size="17" fill="#f4f1e8"><tspan class="ch ch-d600">h</tspan><tspan class="ch ch-d690">i</tspan></text>
      <rect class="cursor" x="86" y="126" width="9" height="18" fill="#e8a33d" style="animation-delay:0.93s"/>

      <text x="40" y="210" font-size="17" font-weight="700" fill="#e8a33d">vv</text>
      <text class="resp resp-line0" x="150" y="210" font-size="17" fill="#f4f1e8">You're back. Landing page copy is done —</text><text class="resp resp-line1" x="150" y="240" font-size="17" fill="#f4f1e8">next step: add the pricing section.</text><text class="resp resp-line2" x="150" y="270" font-size="17" fill="#f4f1e8">[Pricing page] is stuck on your review,</text><text class="resp resp-line3" x="150" y="300" font-size="17" fill="#f4f1e8">[Q3 roadmap] hasn't started. Which first?</text>
    </g>
  </g>
</svg>
